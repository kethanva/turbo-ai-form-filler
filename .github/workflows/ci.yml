name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist files exist
        run: |
          test -f dist/content.bundle.js  || (echo "Missing content.bundle.js"  && exit 1)
          test -f dist/popup.bundle.js    || (echo "Missing popup.bundle.js"    && exit 1)
          test -f dist/options.bundle.js  || (echo "Missing options.bundle.js"  && exit 1)
          test -f dist/background.js      || (echo "Missing background.js"      && exit 1)
          echo "✅ All dist files present"

      - name: Guard content bundle against key material
        run: |
          if grep -E 'gsk_[A-Za-z0-9]{8,}|Authorization.: .Bearer' dist/content.bundle.js; then
            echo "Content bundle must not contain API keys or Bearer headers"
            exit 1
          fi
          echo "✅ Content bundle has no key material"
