<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>form-autopilot</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #333;
    }

    .status {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 500;
    }

    .status.ready {
      background-color: #e8f5e9;
      color: #2e7d32;
    }

    .status.running {
      background-color: #fff3e0;
      color: #e65100;
    }

    .status.error {
      background-color: #ffebee;
      color: #c62828;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }

    #startButton {
      background-color: #1976d2;
      color: white;
    }

    #startButton:hover:not(:disabled) {
      background-color: #1565c0;
    }

    #startButton:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #settingsButton {
      background-color: #757575;
      color: white;
    }

    #settingsButton:hover {
      background-color: #616161;
    }

    .info {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>🚀 form-autopilot</h1>
  </div>
  <div id="status" class="status ready">Ready</div>
  <button id="startButton">Start Filling Forms</button>
  <button id="settingsButton">Settings</button>
  <div class="info">
    <div>Filled <span id="filledCount" class="color-green">0 fields</span></div>
  </div>
  <script src="dist/popup.bundle.js"></script>
</body>

</html>
